services:
  # Spring Boot Backend Service
  - type: web
    name: ubs-backend
    env: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: ubs-db
          property: connectionString
      - key: DATABASE_USER
        fromDatabase:
          name: ubs-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: ubs-db
          property: password
      - key: JWT_SECRET
        generateValue: true
    
  # PostgreSQL Database
  - type: psql
    name: ubs-db
    plan: starter
    region: frankfurt
    databaseName: ubs_prod
    user: ubs_admin
