services:
  # Spring Boot Backend Service
  - type: web
    name: ubs-backend
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: CORS_ALLOWED_ORIGINS
        value: https://ubs-mgt-system.vercel.app,https://ubs-mgt-system-bqzd.vercel.app,http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:5173
      - key: DATABASE_HOST
        fromDatabase:
          name: ubs-db
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: ubs-db
          property: port
      - key: DATABASE_NAME
        fromDatabase:
          name: ubs-db
          property: database
      - key: DATABASE_USERNAME
        fromDatabase:
          name: ubs-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: ubs-db
          property: password
      - key: JWT_SECRET
        generateValue: true
    
databases:
  - name: ubs-db
    plan: free
    region: frankfurt
    databaseName: ubs_prod
    user: ubs_admin
