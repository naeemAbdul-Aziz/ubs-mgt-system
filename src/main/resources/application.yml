# =============================================================================
# UBS-LMIS — Application Configuration
# Spring Boot 3.3 · PostgreSQL 16 · Flyway · JWT
#
# All sensitive values are injected from environment variables (12-factor app).
# See .env.example for the full variable reference.
# =============================================================================

spring:
  application:
    name: ubs-lmis

  # ─── Data Source ───────────────────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:ubs_lmis}
    username: ${DATABASE_USERNAME:ubs_lmis_app}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: UbsLmisPool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ─── JPA / Hibernate ───────────────────────────────────────────────────────
  jpa:
    hibernate:
      # NEVER use create/update in production — schema is owned by Flyway
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
        jdbc:
          time_zone: UTC
    open-in-view: false  # disable OSIV to prevent hidden lazy-loading issues

  # ─── Flyway ────────────────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    out-of-order: false
    validate-on-migrate: true
    clean-disabled: true  # NEVER allow clean in any environment

  # ─── Mail ──────────────────────────────────────────────────────────────────
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:noreply@ubs-lmis.example}
    properties:
      mail:
        smtp:
          auth: ${MAIL_TLS_ENABLED:false}
          starttls:
            enable: ${MAIL_TLS_ENABLED:false}

  # ─── Jackson ───────────────────────────────────────────────────────────────
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
    time-zone: UTC

# ─── Server ──────────────────────────────────────────────────────────────────
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never     # prevent Spring's default error body leaking stack traces
    include-binding-errors: never
  servlet:
    encoding:
      charset: UTF-8
      enabled: true

# ─── Actuator ────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,flyway
  endpoint:
    health:
      show-details: when-authorized
  health:
    mail:
      enabled: false
  info:
    env:
      enabled: true

info:
  app:
    name: UBS-LMIS
    description: University Basic School Learning Management & Information System
    version: "@project.version@"

# ─── SpringDoc / OpenAPI ─────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  show-actuator: false
  default-produces-media-type: application/json

# ─── Application-specific configuration ─────────────────────────────────────
app:
  # JWT configuration
  jwt:
    secret: ${JWT_SECRET:INSECURE_LOCAL_DEV_SECRET_CHANGE_IN_PRODUCTION}
    access-token-expiry-minutes: ${JWT_ACCESS_TOKEN_EXPIRY_MINUTES:15}
    refresh-token-expiry-days: ${JWT_REFRESH_TOKEN_EXPIRY_DAYS:30}

  # School identity (used in notifications and report cards)
  school:
    name: ${SCHOOL_NAME:University Basic School}
    short-name: ${SCHOOL_SHORT_NAME:UBS}
    location: ${SCHOOL_LOCATION:Legon, Accra, Ghana}

  # Communication
  sms:
    provider: ${SMS_PROVIDER:STUB}   # HUBTEL | ARKESEL | TWILIO | STUB
    hubtel:
      client-id: ${SMS_HUBTEL_CLIENT_ID:}
      client-secret: ${SMS_HUBTEL_CLIENT_SECRET:}
      sender-id: ${SMS_HUBTEL_SENDER_ID:UBS-LMIS}
    arkesel:
      api-key: ${SMS_ARKESEL_API_KEY:}
      sender-id: ${SMS_ARKESEL_SENDER_ID:UBS-LMIS}

  # Document storage
  documents:
    storage-type: ${DOCUMENT_STORAGE_TYPE:FILESYSTEM}   # FILESYSTEM | S3
    base-path: ${DOCUMENT_STORAGE_BASE_PATH:./data/documents}

  # Security
  security:
    # Max failed login attempts before lockout (BR-SE-005)
    max-login-attempts: 5
    # Lockout duration in minutes (exponential backoff starting here)
    lockout-duration-minutes: 15
    # CORS — allowed origins for the future frontend
    cors:
      allowed-origins: http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:5173
