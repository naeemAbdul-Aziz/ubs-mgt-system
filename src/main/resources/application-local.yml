# =============================================================================
# Local development profile overrides
# Active when SPRING_PROFILES_ACTIVE=local (set in docker-compose.yml or IDE)
# =============================================================================

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/ubs_lmis
    username: ubs_lmis_app
    password: local_dev_password_change_in_prod

  jpa:
    show-sql: true

  flyway:
    # Allow clean in local dev only (for resetting state during development)
    # Still disabled by default — must be explicitly set to true on the CLI
    clean-disabled: true

# Use MailHog for local email testing (http://localhost:8025)
  mail:
    host: localhost
    port: 1025

app:
  jwt:
    secret: local_dev_jwt_secret_at_least_32_chars_long_here
    access-token-expiry-minutes: 60   # longer TTL for local dev convenience

  sms:
    provider: STUB   # No real SMS in local dev; log to console

  security:
    cors:
      allowed-origins: http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:5173,http://localhost:4200

logging:
  level:
    com.drakalabs.schoolmngsys: DEBUG
    org.springframework.security: DEBUG
    org.flywaydb: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
